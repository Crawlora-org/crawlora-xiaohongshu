[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-xiaohongshu"
version = "0.1.0"
description = "Crawlora Xiaohongshu API client with 4 endpoints for public explore feeds, note details, comments, and search suggestions"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "xiaohongshu", "xiaohongshu-api", "xiaohongshu-scraper", "xiaohongshu-data", "xiaohongshu-public-explore-feeds", "xiaohongshu-note-details", "xiaohongshu-comments", "xiaohongshu-search-suggestions"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=xiaohongshu-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=xiaohongshu-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-xiaohongshu"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_xiaohongshu"]

[tool.setuptools.package-data]
"crawlora_xiaohongshu" = ["py.typed", "*.pyi"]
